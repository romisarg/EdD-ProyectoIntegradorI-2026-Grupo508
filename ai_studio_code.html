<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerra Futurista | Juego de Cartas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --mango: #FFCB2F;
            --coral: #FF5A7A;
            --turquesa: #27DCD3;
            --bg-dark: #12121e;
            --panel-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER Y MARCADOR GLOBAL */
        header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(90deg, rgba(255,90,122,0.2) 0%, rgba(255,203,47,0.2) 100%);
            border-bottom: 2px solid var(--coral);
        }

        h1 {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--mango), var(--coral));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .round-info {
            color: var(--turquesa);
            font-weight: 600;
            margin-top: 5px;
            font-size: 1.2rem;
        }

        /* ÁREA DE JUEGO */
        .game-board {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* CENTRO (Mazo y Botón) */
        .center-hub {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .deck {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, var(--coral), var(--mango));
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 90, 122, 0.5);
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .deck::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 100px;
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 5px;
        }

        button.btn-deal {
            background-color: var(--turquesa);
            color: var(--bg-dark);
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--turquesa);
        }

        button.btn-deal:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--turquesa);
            background-color: #fff;
        }

        button.btn-deal:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* JUGADORES */
        .players-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 40px;
            width: 100%;
            max-width: 1000px;
            height: 100%;
        }

        .player-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
        }

        .player-panel.winner-round {
            border-color: var(--mango);
            box-shadow: 0 0 20px rgba(255, 203, 47, 0.4);
        }

        .player-name {
            font-weight: 600;
            color: var(--turquesa);
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .stats span {
            background: rgba(0,0,0,0.4);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .stats strong {
            color: var(--mango);
        }

        /* CARTAS */
        .card-slot {
            width: 90px;
            height: 130px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .card {
            width: 90px;
            height: 130px;
            background: #fff;
            border-radius: 10px;
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            font-weight: 800;
            font-size: 1.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            opacity: 0; /* Oculta por defecto */
        }

        .card.red { color: var(--coral); }
        .card.black { color: #222; }

        .card .top { align-self: flex-start; line-height: 1;}
        .card .bottom { align-self: flex-end; transform: rotate(180deg); line-height: 1;}
        .card .center-suit { 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            opacity: 0.2;
        }

        /* EFECTO DE BARRIDO FUTURISTA (Motion Blur) */
        @keyframes dealSweep {
            0% {
                transform: scale(0.2) translate(0, 0);
                filter: blur(15px);
                opacity: 0;
            }
            50% {
                filter: blur(5px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translate(0, 0);
                filter: blur(0px);
                opacity: 1;
            }
        }

        .anim-deal {
            animation: dealSweep 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* OVERLAY RESULTADO FINAL */
        #game-over-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 30, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #game-over-modal h2 {
            font-size: 3rem;
            color: var(--mango);
            margin-bottom: 20px;
            text-align: center;
        }

        #final-scores {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid var(--turquesa);
            margin-bottom: 30px;
        }

        .final-player {
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin: 10px 0;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        @media (max-width: 768px) {
            .players-container { gap: 15px; }
            .player-panel { padding: 10px; }
            .card-slot, .card { width: 70px; height: 100px; font-size: 1.2rem; }
            button.btn-deal { font-size: 0.9rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Guerra Futurista</h1>
        <div class="round-info" id="round-display">Ronda 1 de 3</div>
    </header>

    <div class="game-board">
        <div class="center-hub">
            <div class="deck"></div>
            <button id="btn-deal" class="btn-deal" onclick="playRound()">Repartir Ronda</button>
        </div>

        <div class="players-container">
            <!-- Jugador 1 -->
            <div class="player-panel" id="panel-p0">
                <div class="player-name">Jugador 1</div>
                <div class="stats">
                    <span>Cartas: <strong id="cards-p0">0</strong></span>
                    <span>Puntos: <strong id="score-p0">0</strong></span>
                </div>
                <div class="card-slot" id="slot-p0"></div>
            </div>
            
            <!-- Jugador 2 -->
            <div class="player-panel" id="panel-p1">
                <div class="player-name">Jugador 2</div>
                <div class="stats">
                    <span>Cartas: <strong id="cards-p1">0</strong></span>
                    <span>Puntos: <strong id="score-p1">0</strong></span>
                </div>
                <div class="card-slot" id="slot-p1"></div>
            </div>

            <!-- Jugador 3 -->
            <div class="player-panel" id="panel-p2">
                <div class="player-name">Jugador 3</div>
                <div class="stats">
                    <span>Cartas: <strong id="cards-p2">0</strong></span>
                    <span>Puntos: <strong id="score-p2">0</strong></span>
                </div>
                <div class="card-slot" id="slot-p2"></div>
            </div>

            <!-- Jugador 4 -->
            <div class="player-panel" id="panel-p3">
                <div class="player-name">Jugador 4</div>
                <div class="stats">
                    <span>Cartas: <strong id="cards-p3">0</strong></span>
                    <span>Puntos: <strong id="score-p3">0</strong></span>
                </div>
                <div class="card-slot" id="slot-p3"></div>
            </div>
        </div>
    </div>

    <!-- Modal de Fin de Juego -->
    <div id="game-over-modal">
        <h2 id="winner-text">¡Juego Terminado!</h2>
        <div id="final-scores"></div>
        <button class="btn-deal" onclick="location.reload()">Jugar de Nuevo</button>
    </div>

    <script>
        // --- ESTRUCTURAS DE DATOS ---
        const suits = ['♠', '♥', '♦', '♣'];
        // J=11, Q=12, K=13, A=14
        const values = [
            { name: '2', val: 2 }, { name: '3', val: 3 }, { name: '4', val: 4 }, 
            { name: '5', val: 5 }, { name: '6', val: 6 }, { name: '7', val: 7 }, 
            { name: '8', val: 8 }, { name: '9', val: 9 }, { name: '10', val: 10 }, 
            { name: 'J', val: 11 }, { name: 'Q', val: 12 }, { name: 'K', val: 13 }, { name: 'A', val: 14 }
        ];

        let deck = [];
        let players = [
            { id: 0, name: "Jugador 1", wonCards: [] },
            { id: 1, name: "Jugador 2", wonCards: [] },
            { id: 2, name: "Jugador 3", wonCards: [] },
            { id: 3, name: "Jugador 4", wonCards: [] }
        ];
        let currentRound = 1;
        const maxRounds = 3;

        // --- LÓGICA DEL MAZO ---
        function createDeck() {
            deck = [];
            for (let suit of suits) {
                for (let v of values) {
                    deck.push({ suit: suit, name: v.name, val: v.val, color: (suit === '♥' || suit === '♦') ? 'red' : 'black' });
                }
            }
        }

        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        // --- RENDERIZADO DE CARTAS ---
        function createCardHTML(card) {
            return `
                <div class="card ${card.color} anim-deal">
                    <div class="top">${card.name}${card.suit}</div>
                    <div class="center-suit">${card.suit}</div>
                    <div class="bottom">${card.name}${card.suit}</div>
                </div>
            `;
        }

        // --- LÓGICA DEL JUEGO ---
        function playRound() {
            const btn = document.getElementById('btn-deal');
            btn.disabled = true;

            // Limpiar estilos de ganador anterior
            players.forEach(p => document.getElementById(`panel-p${p.id}`).classList.remove('winner-round'));

            // Repartir 1 carta a cada jugador (asegurarse que hay cartas)
            let roundCards = [];
            for (let i = 0; i < 4; i++) {
                const card = deck.pop();
                roundCards.push({ playerId: i, card: card });
                
                // Mostrar en UI
                const slot = document.getElementById(`slot-p${i}`);
                slot.innerHTML = createCardHTML(card);
            }

            // Evaluar ronda
            setTimeout(() => evaluateRound(roundCards), 800); // Esperar que termine la animación
        }

        function evaluateRound(roundCards) {
            // Encontrar el valor máximo
            let maxVal = Math.max(...roundCards.map(rc => rc.card.val));
            let winners = roundCards.filter(rc => rc.card.val === maxVal);

            if (winners.length === 1) {
                // Hay un ganador único: se lleva las 4 cartas de la mesa
                let winnerId = winners[0].playerId;
                document.getElementById(`panel-p${winnerId}`).classList.add('winner-round');
                
                roundCards.forEach(rc => {
                    players[winnerId].wonCards.push(rc.card);
                });
            } else {
                // Hay empate en el valor máximo: NADIE gana todo. 
                // REGLA ESTRICTA: Cada jugador de la mesa conserva su propia carta.
                roundCards.forEach(rc => {
                    players[rc.playerId].wonCards.push(rc.card);
                });
                // Indicamos empate visualmente iluminando a todos o a ninguno.
            }

            updateStatsUI();

            currentRound++;
            
            if (currentRound > maxRounds) {
                setTimeout(endGame, 1000);
            } else {
                document.getElementById('round-display').innerText = `Ronda ${currentRound} de 3`;
                document.getElementById('btn-deal').disabled = false;
                document.getElementById('btn-deal').innerText = "Siguiente Ronda";
            }
        }

        function updateStatsUI() {
            players.forEach(p => {
                document.getElementById(`cards-p${p.id}`).innerText = p.wonCards.length;
                let score = p.wonCards.reduce((sum, card) => sum + card.val, 0);
                document.getElementById(`score-p${p.id}`).innerText = score;
            });
        }

        function endGame() {
            // Calcular puntajes finales
            let finalScores = players.map(p => {
                return {
                    name: p.name,
                    score: p.wonCards.reduce((sum, card) => sum + card.val, 0)
                };
            });

            // Ordenar de mayor a menor
            finalScores.sort((a, b) => b.score - a.score);

            // Generar HTML del resultado
            let scoresHTML = '';
            finalScores.forEach((fs, index) => {
                let color = index === 0 ? "var(--mango)" : "#fff";
                scoresHTML += `
                    <div class="final-player" style="color: ${color}">
                        <span>${fs.name}</span>
                        <strong>${fs.score} pts</strong>
                    </div>
                `;
            });

            // Comprobar si hubo empate en el primer puesto
            let winnerText = `¡Ganador: ${finalScores[0].name}!`;
            if (finalScores[0].score === finalScores[1].score) {
                winnerText = "¡Es un Empate!";
            }

            document.getElementById('winner-text').innerText = winnerText;
            document.getElementById('final-scores').innerHTML = scoresHTML;
            
            // Mostrar Modal
            const modal = document.getElementById('game-over-modal');
            modal.style.display = 'flex';
        }

        // --- INICIALIZACIÓN ---
        function initGame() {
            createDeck();
            shuffleDeck();
        }

        // Arrancar el juego al cargar la página
        window.onload = initGame;
    </script>
</body>
</html>
